name: Publish v2.4.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.4.1 >/dev/null 2>&1; then
            echo "v2.4.1 already exists."
            exit 0
          fi

          cat > /tmp/v2.4.1-notes.md <<'EOF'
          Security, privacy, reproducibility, and Windows portability hardening release.

          ## Highlights
          - Removes the standalone plaintext Playwright auth-state export; session persistence stays inside the dedicated Chromium profile.
          - Automatically removes the legacy `_brightspace-auth-state.json` backup from v2.4.0.
          - Adds post-authentication write protection for mutating HTTP methods and suspicious same-origin POST actions while preserving read-like Brightspace RPC/XHR traffic.
          - Adds Brave, Google Chrome, and Microsoft Edge detection on Windows plus a clean Windows Playwright browser smoke test.
          - Adds full-Git-history and working-tree privacy/security scans.
          - Pins Playwright to 1.55.1, addressing the high-severity SSL-certificate verification advisory affecting versions below 1.55.1.
          - Commits a lockfile, uses `npm ci`, and adds a high-severity dependency audit gate.

          ## Validation
          The release commit passed Node.js 20 and 22 functional/security tests, the full-history privacy scan, the runtime dependency audit, and an actual persistent-profile Playwright launch on a clean GitHub-hosted Windows runner.

          Brightspace Sync remains a read-focused Windows desktop tool. It is not mathematically read-only, and institution-specific Brightspace/SSO compatibility can still vary.
          EOF

          gh release create v2.4.1 \
            --target 76a689815f0528a835944ba0118724638d93884f \
            --title "Brightspace Sync v2.4.1" \
            --notes-file /tmp/v2.4.1-notes.md
