name: Publish v2.4.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.4.0-final.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Prepare version and docs
        shell: bash
        run: |
          set -euo pipefail
          files=(package.json QUICK_SYNC.cmd FULL_SYNC.cmd START_HERE.cmd SETUP_LOGIN.cmd SCHEDULED_SYNC.cmd PUBLISH_TO_DRIVE.cmd src/index.mjs src/scheduled.mjs)
          for f in "${files[@]}"; do
            grep -q '2.3.0' "$f"
            sed -i 's/2\.3\.0/2.4.0/g' "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = 'The sync digest turns raw change metadata into a compact cross-course summary of what was added or updated during the latest run. Student-facing changes are grouped separately from technical mirror changes such as asset-index/file updates.'
          if old in s and 'deadline-change intelligence' not in s:
              s = s.replace(old, old + '\n\nIt also performs deadline-change intelligence by comparing the newly generated deadline set with the previous sync. The digest can identify newly dated work, due-date/time changes, and deadline removals while avoiding false "deadline removed" reports when an item itself disappears from Brightspace.', 1)
          s = s.replace('npm run school-indexes-selftest\nnpm run security-selftest', 'npm run school-indexes-selftest\nnpm run deadline-intelligence-selftest\nnpm run asset-index-selftest\nnpm run security-selftest')
          s = s.replace('Latest stable release: **[v2.2.0](https://github.com/aryanramz/brightspace-sync/releases/tag/v2.2.0)**', 'Latest stable release: **[v2.4.0](https://github.com/aryanramz/brightspace-sync/releases/tag/v2.4.0)**')
          s = s.replace('Latest stable release: **[v2.3.0](https://github.com/aryanramz/brightspace-sync/releases/tag/v2.3.0)**', 'Latest stable release: **[v2.4.0](https://github.com/aryanramz/brightspace-sync/releases/tag/v2.4.0)**')
          p.write_text(s, encoding='utf-8')
          PY

          cat > /tmp/v240-notes.md <<'EOF'
          # v2.4.0

          Deadline-change intelligence for cross-course deadline tracking.

          ## Highlights

          - Compares normalized deadlines against the previous sync before the upcoming index is overwritten.
          - Detects due-date and due-time changes with structured `before` and `after` values.
          - Detects newly dated assignments, quizzes, and calendar-backed work.
          - Detects deadline removal only when the item itself still exists, avoiding false positives when an item disappears entirely.
          - Adds a dedicated **Deadline changes** section to `sync-digest.md`.
          - Adds structured `deadlineChanges` entries and counts to `sync-digest.json`.
          - Applies deadline intelligence to school-wide and active-term digests.
          - Adds regression coverage for moved, added, removed, disappeared-item, and first-run baseline cases.
          - Preserves clean unchanged Quick Sync behavior with zero deadline-change false positives.

          ## Validation

          The deadline-intelligence self-test passes. A live unchanged Quick Sync produced 0 added, 0 updated, 33 upcoming deadlines, 0 deadline changes, 0 digest entries, and a successful incremental Google Drive publish.

          No migration is required for existing installs. Existing `config.json`, `.brightspace-profile/`, and `BrightspaceMirror/` remain local and are not replaced by release files.

          EOF
          cat /tmp/v240-notes.md RELEASE_NOTES.md > /tmp/release-notes-all.md
          mv /tmp/release-notes-all.md RELEASE_NOTES.md

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.mjs; do node --check "$f"; done
          npm run selftest
          npm run publish-selftest
          npm run lock-selftest
          npm run school-indexes-selftest
          npm run deadline-intelligence-selftest
          npm run asset-index-selftest
          npm run security-selftest

      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md RELEASE_NOTES.md QUICK_SYNC.cmd FULL_SYNC.cmd START_HERE.cmd SETUP_LOGIN.cmd SCHEDULED_SYNC.cmd PUBLISH_TO_DRIVE.cmd src/index.mjs src/scheduled.mjs
          git commit -m "Release v2.4.0"
          git push

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.4.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v2.4.0 already exists; nothing to do."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          gh release create v2.4.0 \
            --repo "${{ github.repository }}" \
            --target "$sha" \
            --title "Brightspace Sync v2.4.0" \
            --notes-file /tmp/v240-notes.md
