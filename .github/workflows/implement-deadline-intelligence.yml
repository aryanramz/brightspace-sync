name: Implement deadline intelligence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-deadline-intelligence.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch integration
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/school-indexes.mjs')
          s = p.read_text(encoding='utf-8')

          old = "import { ensureDir, writeJson, writeText } from './utils.mjs';\n"
          new = old + "import { buildDeadlineIntelligence } from './deadline-intelligence.mjs';\n"
          assert old in s and "deadline-intelligence.mjs" not in s
          s = s.replace(old, new, 1)

          old = "export function buildSyncDigest(changes, mode, completedAt, activeTerms = []) {"
          new = "export function buildSyncDigest(changes, mode, completedAt, activeTerms = [], deadlineChanges = []) {"
          assert old in s
          s = s.replace(old, new, 1)

          old = """      studentFacing: studentFacing.length,\n      technical: technical.length\n    },\n    changes: normalized,\n    studentFacing,\n    technical\n  };"""
          new = """      studentFacing: studentFacing.length,\n      technical: technical.length,\n      deadlineChanges: deadlineChanges.length\n    },\n    changes: normalized,\n    studentFacing,\n    technical,\n    deadlineChanges\n  };"""
          assert old in s
          s = s.replace(old, new, 1)

          marker = "function formatDigestMarkdown(digest) {"
          assert marker in s
          helper = r'''function deadlineChangeLabel(kind) {
            if (kind === 'deadline-added') return 'New deadline';
            if (kind === 'deadline-removed') return 'Deadline removed';
            return 'Deadline changed';
          }

          function deadlineDisplay(snapshot) {
            if (!snapshot) return 'none';
            if (snapshot.dueAt) {
              return new Date(snapshot.dueAt).toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
              });
            }
            return snapshot.dueDate || snapshot.dueText || 'unknown';
          }

          function formatDeadlineChangeSection(lines, items) {
            lines.push('## Deadline changes', '');
            let lastCourse = null;
            for (const item of items) {
              const course = item.course || 'School-wide';
              if (course !== lastCourse) {
                lastCourse = course;
                lines.push(`### ${course}`, '');
              }
              const label = deadlineChangeLabel(item.kind);
              const url = item.url ? ` — ${item.url}` : '';
              if (item.kind === 'deadline-added') {
                lines.push(`- **${label}** — ${item.title} — ${deadlineDisplay(item.after)}${url}`);
              } else if (item.kind === 'deadline-removed') {
                lines.push(`- **${label}** — ${item.title} — was ${deadlineDisplay(item.before)}${url}`);
              } else {
                lines.push(`- **${label}** — ${item.title} — ${deadlineDisplay(item.before)} → ${deadlineDisplay(item.after)}${url}`);
              }
            }
            lines.push('');
          }

          '''
          s = s.replace(marker, helper + marker, 1)

          old = """    `Mode: ${digest.syncMode}`,\n    `Changes: ${digest.summary.total} total (${digest.summary.added} added, ${digest.summary.updated} updated)`,\n    ''\n  ];\n  if (!digest.changes.length) {\n    lines.push('No mirror changes were detected in this sync.', '');\n    return lines.join('\\n');\n  }\n  formatDigestSection(lines, 'Added', digest.studentFacing.filter(x => x.action === 'added'));\n  formatDigestSection(lines, 'Updated', digest.studentFacing.filter(x => x.action === 'updated'));\n  if (digest.technical.length) formatDigestSection(lines, 'Technical mirror changes', digest.technical);"""
          new = """    `Mode: ${digest.syncMode}`,\n    `Changes: ${digest.summary.total} total (${digest.summary.added} added, ${digest.summary.updated} updated)`,\n    `Deadline changes: ${digest.summary.deadlineChanges || 0}`,\n    ''\n  ];\n  if (!digest.changes.length && !digest.deadlineChanges.length) {\n    lines.push('No mirror or deadline changes were detected in this sync.', '');\n    return lines.join('\\n');\n  }\n  if (digest.deadlineChanges.length) formatDeadlineChangeSection(lines, digest.deadlineChanges);\n  if (digest.changes.length) {\n    formatDigestSection(lines, 'Added', digest.studentFacing.filter(x => x.action === 'added'));\n    formatDigestSection(lines, 'Updated', digest.studentFacing.filter(x => x.action === 'updated'));\n    if (digest.technical.length) formatDigestSection(lines, 'Technical mirror changes', digest.technical);\n  }"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """export async function writeSchoolIndexes(config, manifest, changes, mode, completedAt) {\n  const schoolDir = path.join(config.outputDir, '_school');\n  const asOf = new Date(completedAt).getTime();\n  const all = [];"""
          new = """export async function writeSchoolIndexes(config, manifest, changes, mode, completedAt) {\n  const schoolDir = path.join(config.outputDir, '_school');\n  const previousUpcoming = await readJson(path.join(schoolDir, 'upcoming.json'), null);\n  const asOf = new Date(completedAt).getTime();\n  const all = [];"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const upcomingItems = sortDeadlineItems(dedupeDeadlines(all).filter(item => {\n    const time = item.dueAt ? Date.parse(item.dueAt) : new Date(`${item.dueDate}T23:59:59`).getTime();\n    return Number.isFinite(time) && time >= asOf - 60 * 1000;\n  }));"""
          new = """  const allDeadlines = dedupeDeadlines(all);\n  const upcomingItems = sortDeadlineItems(allDeadlines.filter(item => {\n    const time = item.dueAt ? Date.parse(item.dueAt) : new Date(`${item.dueDate}T23:59:59`).getTime();\n    return Number.isFinite(time) && time >= asOf - 60 * 1000;\n  }));"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const digest = buildSyncDigest(changes, mode, completedAt, manifest.activeTerms || []);\n  await writeIndexSet(schoolDir, upcoming, digest);"""
          new = """  const deadlineIntelligence = await buildDeadlineIntelligence({\n    previousUpcoming,\n    currentDeadlines: allDeadlines,\n    currentUpcoming: upcomingItems,\n    manifest,\n    completedAt\n  });\n  const deadlineChanges = deadlineIntelligence.changes;\n  const digest = buildSyncDigest(changes, mode, completedAt, manifest.activeTerms || [], deadlineChanges);\n  await writeIndexSet(schoolDir, upcoming, digest);"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    const termDigest = buildSyncDigest((changes || []).filter(x => x.termKey === term.key), mode, completedAt, [term]);"""
          new = """    const termDigest = buildSyncDigest(\n      (changes || []).filter(x => x.termKey === term.key),\n      mode,\n      completedAt,\n      [term],\n      deadlineChanges.filter(x => x.termKey === term.key)\n    );"""
          assert old in s
          s = s.replace(old, new, 1)

          old = "  return { upcoming, digest };"
          new = "  return { upcoming, digest, deadlineChanges };"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/index.mjs')
          s = p.read_text(encoding='utf-8')
          old = "    console.log(`Upcoming deadlines indexed: ${schoolIndexes.upcoming.count}.`);\n    console.log(`Sync digest entries: ${schoolIndexes.digest.summary.total}.`);"
          new = "    console.log(`Upcoming deadlines indexed: ${schoolIndexes.upcoming.count}.`);\n    console.log(`Deadline changes detected: ${schoolIndexes.deadlineChanges.length}.`);\n    console.log(`Sync digest entries: ${schoolIndexes.digest.summary.total}.`);"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/school-indexes.mjs src/index.mjs
          git commit -m "Integrate deadline change intelligence"
          git push
